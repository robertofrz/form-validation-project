<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation Project</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="container">
      <form method="POST" id="form" aria-labelledby="formTitle">
        <h1 id="formTitle">Registration</h1>
        <div id="all-inputs">
          <div class="input-control">
            <label for="username">Username</label>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Enter your username"
              aria-labelledby="username-label"
              aria-describedby="username-error"
            />
            <div id="username-error" class="error"></div>
          </div>
          <div class="input-control">
            <label for="password1" id="password1-label">Password</label>
            <input
              type="password"
              name="password1"
              id="password1"
              placeholder="Enter your password"
              aria-labelledby="password1-label"
              aria-describedby="password1-error"
              aria-invalid="false"
            />
            <i class="fa-solid fa-eye" aria-label="Show password"></i>
            <div id="password1-error" class="error"></div>
          </div>
          <div class="input-control">
            <label for="password2" id="password2-label">Confirm Password</label>
            <input
              type="password"
              name="password2"
              id="password2"
              placeholder="Confirm your password"
              aria-labelledby="password2-label"
              aria-describedby="password2-error"
              aria-invalid="false"
            />
            <i class="fa-solid fa-eye" aria-label="Show password"></i>
            <div id="password2-error" class="error"></div>
          </div>
          <div class="input-control">
            <label for="email" id="email-label">Email</label>
            <input
              type="text"
              name="email"
              id="email"
              placeholder="Enter your email"
              aria-labelledby="email-label"
              aria-describedby="email-error"
              aria-invalid="false"
            />
            <div id="email-error" class="error"></div>
          </div>
        </div>
        <button
          type="submit"
          id="submit-btn"
          aria-label="Submit registration form"
        >
          SIGN UP
        </button>
      </form>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
